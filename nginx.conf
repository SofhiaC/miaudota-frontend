server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota que não seja arquivo volta para o index.html (React Router cuida do resto)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # arquivos com hash no nome podem ser cacheados por muito tempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
